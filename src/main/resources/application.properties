
spring.application.name=queuepilot

spring.datasource.url=jdbc:postgresql://localhost:5432/queuepilot
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
# QueuePilot scheduler
queuepilot.scheduler.poll-delay-ms=1000
queuepilot.scheduler.priority-aging-interval-seconds=10.0

# Worker concurrency pool
queuepilot.workers.pool-size=4
queuepilot.workers.default-capacity=1

# Automatic restart during development
spring.devtools.restart.enabled=true